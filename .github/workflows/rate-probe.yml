name: rate probe
# Measures whether a polling interval stays under Apple's per-IP limit for an hour. Sends no alerts.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        interval: [120]
    steps:
      - uses: actions/checkout@v4
      - run: python3 checker.py --interval ${{ matrix.interval }} --duration 3600 --state /tmp/s.json
