name: duochecker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["checker.py", ".github/workflows/check.yml", ".github/workflows/test-alert.yml"]

# One checker at a time; the next scheduled run waits in the queue and takes over when this one ends.
# A push (code change) replaces the running checker immediately.
concurrency:
  group: duochecker
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      CALLMEBOT_RECIPIENTS: ${{ secrets.CALLMEBOT_RECIPIENTS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STATUS_ALERTS: "1"
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
      TWILIO_TO: ${{ secrets.TWILIO_TO }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore last-known stock
        uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Watch stock (~5h45m, every 5 min)
        run: python3 checker.py --interval 300 --duration 20700
